encoders:
  selfies:
    d_model: 128
    n_heads: 4
    n_layers: 4
    d_ff: 256
    dropout: 0.1
    max_len: 128
  graph:
    hidden_dim: 128
    n_layers: 4
    dropout: 0.1
  schnet:
    hidden_channels: 128
    num_filters: 128
    num_interactions: 3
    num_gaussians: 50
    cutoff: 10.0
    max_z: 100
    agg_mode: learned_attention   # locked in from notebook 05's result

fusion:
  type: concat        # concat | gated  -- overridden per run in the notebook
  fusion_dim: 128

train:
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.00001
  epochs: 60
  patience: 10
  seed: 42

paths:
  splits_file: ../data/splits.json
  vocab_file: ../data/processed/selfies_vocab.json   # reuse the train-only vocab from notebook 03
  conformers_dir: ../data/processed/conformers
  experiment_dir_concat: ../experiments/multimodal_concat
  experiment_dir_gated: ../experiments/multimodal_fusion
